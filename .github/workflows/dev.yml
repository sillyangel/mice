name: Dev Docker Build

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: sillyangel/mice

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Extract metadata ----------
      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # ---------- Docker Buildx ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Login ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sillyangel
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- Docker metadata ----------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ steps.commit.outputs.sha_short }}
            type=sha,prefix=dev-

          labels: |
            org.opencontainers.image.title=Mice
            org.opencontainers.image.description=Dev build from branch dev
            org.opencontainers.image.version=dev
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha_full }}
            org.opencontainers.image.created=${{ steps.commit.outputs.date }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.commit-sha=${{ steps.commit.outputs.sha_full }}

      # ---------- Build & push ----------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: |
            ${{ steps.meta.outputs.labels }}

          build-args: |
            BUILDKIT_INLINE_CACHE=1

          cache-from: type=gha
          cache-to: type=gha,mode=max
